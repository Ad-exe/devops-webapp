name: CI Pipeline with ChatOps

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML file
        run: |
          echo "Starting CI pipeline..."
          ls -la
          test -f index.html

      - name: Build successful
        run: |
          echo "Website build completed successfully!"

      - name: Slack Success Notification
        if: success()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"✅ SUCCESS: CI Pipeline completed successfully!"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack Failure Notification
        if: failure()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"❌ FAILURE: CI Pipeline failed!"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}